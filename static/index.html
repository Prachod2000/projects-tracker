<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects Tracker</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #0b3d4f; color: #fff; padding: 16px 24px; font-size: 20px; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 24px; }
    h2 { margin-top: 0; font-size: 16px; }
    form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    label { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    textarea { grid-column: 1 / -1; resize: vertical; }
    .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font: inherit; }
    .primary { background: #0b3d4f; color: #fff; }
    .secondary { background: #e0e4e8; }
    .danger { background: #c0392b; color: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e8eb; font-size: 14px; }
    th { background: #f0f2f4; }
    .badge { padding: 3px 8px; border-radius: 10px; font-size: 12px; background: #e0e4e8; }
    .badge.In\ Progress { background: #fff3cd; }
    .badge.Completed { background: #d4edda; }
    .badge.On\ Hold { background: #f8d7da; }
    td button { margin-right: 6px; padding: 5px 10px; font-size: 13px; }
    #msg { color: #c0392b; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <header>Projects Tracker</header>
  <main>
    <div class="card">
      <h2 id="formTitle">Add project</h2>
      <form id="projectForm">
        <input type="hidden" id="Id">
        <label>Name *<input id="Name" required></label>
        <label>Owner<input id="Owner"></label>
        <label>Status
          <select id="Status">
            <option>Not Started</option>
            <option>In Progress</option>
            <option>On Hold</option>
            <option>Completed</option>
          </select>
        </label>
        <label>Start date<input type="date" id="StartDate"></label>
        <label>Due date<input type="date" id="DueDate"></label>
        <label></label>
        <textarea id="Notes" rows="2" placeholder="Notes"></textarea>
        <div class="actions">
          <button type="submit" class="primary" id="saveBtn">Add</button>
          <button type="button" class="secondary" id="cancelBtn" style="display:none">Cancel</button>
        </div>
      </form>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>All projects (<span id="count">0</span>)</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Owner</th><th>Status</th><th>Start</th><th>Due</th><th>Notes</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const API = "/api/projects";
    const fields = ["Name", "Owner", "Status", "StartDate", "DueDate", "Notes"];
    const $ = id => document.getElementById(id);

    // ---------- Load and display ----------
    async function loadProjects() {
      const res = await fetch(API);
      const projects = await res.json();
      $("count").textContent = projects.length;
      $("rows").innerHTML = projects.map(p => `
        <tr>
          <td>${esc(p.Name)}</td>
          <td>${esc(p.Owner)}</td>
          <td><span class="badge ${esc(p.Status)}">${esc(p.Status)}</span></td>
          <td>${esc(p.StartDate)}</td>
          <td>${esc(p.DueDate)}</td>
          <td>${esc(p.Notes)}</td>
          <td>
            <button class="secondary" onclick='startEdit(${JSON.stringify(p)})'>Edit</button>
            <button class="danger" onclick="removeProject(${p.Id})">Delete</button>
          </td>
        </tr>`).join("");
    }

    function esc(v) {
      return (v ?? "").toString().replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ---------- Add / Update ----------
    $("projectForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = {};
      fields.forEach(f => body[f] = $(f).value || null);
      const id = $("Id").value;

      const res = await fetch(id ? `${API}/${id}` : API, {
        method: id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) { $("msg").textContent = (await res.json()).error || "Something went wrong"; return; }
      resetForm();
      loadProjects();
    });

    function startEdit(p) {
      fields.forEach(f => $(f).value = p[f] ?? "");
      $("Id").value = p.Id;
      $("formTitle").textContent = `Edit project #${p.Id}`;
      $("saveBtn").textContent = "Save changes";
      $("cancelBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      $("projectForm").reset();
      $("Id").value = "";
      $("formTitle").textContent = "Add project";
      $("saveBtn").textContent = "Add";
      $("cancelBtn").style.display = "none";
      $("msg").textContent = "";
    }
    $("cancelBtn").addEventListener("click", resetForm);

    // ---------- Delete ----------
    async function removeProject(id) {
      if (!confirm("Delete this project?")) return;
      await fetch(`${API}/${id}`, { method: "DELETE" });
      loadProjects();
    }

    loadProjects();
  </script>
</body>
</html>
